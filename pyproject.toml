[project]
name = "demo-agent"
version = "0.1.0"
description = "Simple OpenAI Agents SDK demo with function tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.2.0",
    "python-dotenv>=1.0.0",
    "openinference-instrumentation-openai-agents>=1.6.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
]

[project.scripts]
demo-agent = "demo_agent.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
